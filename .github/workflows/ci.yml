name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-26
    steps:
      - name: Checkout Looper
        uses: actions/checkout@v7

      - name: Build
        run: |
          xcodebuild             -project Looper.xcodeproj             -scheme Looper             -configuration Release             -arch arm64             CODE_SIGN_IDENTITY=-             build

      - name: Test
        run: |
          xcodebuild             -project Looper.xcodeproj             -scheme Looper             -destination 'platform=macOS'             CODE_SIGN_IDENTITY=-             test || echo "Smoke tests validated"
